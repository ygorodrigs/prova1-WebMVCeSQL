<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resumo da Clínica</title>
</head>
<body>
    <h1>Resumo Geral da Clínica</h1>
    <p>Total de animais: <span th:text="${totalAnimais}">0</span></p>
    <p>Média de idade: <span th:text="${mediaIdade}">0.00</span> anos</p>
    <p>Animal mais velho: <span th:text="${animalMaisVelho}">Nome</span></p>
    <p>Gerado em: <span th:text="${dataHora}">00/00/0000 00:00:00</span></p>
</body>
</html>
