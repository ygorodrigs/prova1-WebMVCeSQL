<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ficha do Tutor</title>
</head>
<body>
    <h1>Ficha do Tutor</h1>
    <p>Nome: <span th:text="${tutor.nome}">Nome</span></p>
    <p>Telefone: <span th:text="${tutor.telefone}">Telefone</span></p>
    <p>Quantidade de Animais: <span th:text="${qtdAnimais}">0</span></p>
</body>
</html>
